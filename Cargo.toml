[workspace]
members = [
    "crates/sigil-core",
    "crates/sigil-crypto",
    "crates/sigil-store",
    "crates/sigil-service",
    "crates/sigil-ipc",
    "crates/sigil-client",
    "crates/sigil-secret-service",
    "crates/sigil",
    "crates/sigil-cli",
    "crates/sigil-prompter",
    "crates/sigil-pam",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
zbus = "5.4"
oo7 = "0.6"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
chacha20poly1305 = "0.10"
argon2 = "0.5"
zeroize = { version = "1.8", features = ["derive"] }
thiserror = "2.0"
directories = "6.0"
rand = { version = "0.8", features = ["getrandom"] }
aes = "0.8"
cbc = "0.1"
sha2 = "0.10"
hkdf = "0.12"
hmac = "0.12"
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
iris = { git = "https://github.com/ming2k/optics", tag = "v0.0.33" }
lens = { git = "https://github.com/ming2k/optics", tag = "v0.0.33" }
lens-sys = { git = "https://github.com/ming2k/optics", tag = "v0.0.33" }
flux = { git = "https://github.com/ming2k/optics", tag = "v0.0.33" }
flux-sys = { git = "https://github.com/ming2k/optics", tag = "v0.0.33" }
inotify = { version = "0.10", features = ["stream"] }
libc = "0.2"
