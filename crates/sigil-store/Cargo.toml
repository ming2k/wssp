[package]
name = "sigil-store"
version = "0.1.0"
edition = "2021"
authors = ["Sigil Project"]
description = "Secure durable storage and vault file persistence for sigil"

[dependencies]
sigil-core = { path = "../sigil-core" }
sigil-crypto = { path = "../sigil-crypto" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }
