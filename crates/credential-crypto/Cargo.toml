[package]
name = "credential-crypto"
version = "0.1.0"
edition = "2021"
authors = ["Aegis Project"]
description = "Cryptographic primitives and key derivation for credentiald"

[dependencies]
credential-core = { path = "../credential-core" }
chacha20poly1305 = { workspace = true }
argon2 = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
